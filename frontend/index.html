<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScriptSense</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #f5f7fb; color: #172033; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      button, input, textarea { font: inherit; }
      button { transition: transform .16s ease, box-shadow .16s ease, background .16s ease; }
      button:hover:not(:disabled) { transform: translateY(-1px); }
      button:disabled { cursor: not-allowed; opacity: .65; }
      input::placeholder, textarea::placeholder { color: #8a95a8; }
      a { color: inherit; text-decoration: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
